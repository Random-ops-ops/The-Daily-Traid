<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>The Daily Triad — Dragon Tamer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0e0b16;
  --panel:#181228;
  --panel-2:#1f1834;
  --line:rgba(232,184,75,0.16);
  --parchment:#f4ead2;
  --parchment-dim:#c9bfa8;
  --ember:#ff7a4a;
  --ember-dim:#c65a34;
  --gold:#e8b84b;
  --gold-bright:#ffd876;
  --danger:#e5484d;
  --good:#5fd68a;
  --common:#9aa0ad;
  --uncommon:#4fbf6b;
  --rare:#4d9bef;
  --epic:#b06cf0;
  --legendary:#f0b93c;
  --radius-lg:22px;
  --radius-md:14px;
  --shadow-deep: 0 20px 50px -20px rgba(0,0,0,0.7);
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ink:#f4ead2; --panel:#fffaf0; --panel-2:#fff2d8; --parchment:#241a10; --parchment-dim:#5c4a34;
    --line: rgba(120,80,20,0.18);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #2a1c42 0%, transparent 60%),
    radial-gradient(900px 500px at 90% 10%, rgba(255,122,74,0.08) 0%, transparent 55%),
    var(--ink);
  color:var(--parchment);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  padding-bottom:92px;
}
h1,h2,h3,.display{font-family:'Cinzel',serif;letter-spacing:0.01em;}

/* ---------- Header ---------- */
.dashboard{
  position:sticky; top:0; z-index:40;
  backdrop-filter: blur(14px);
  background:linear-gradient(180deg, rgba(14,11,22,0.96), rgba(14,11,22,0.82));
  border-bottom:1px solid var(--line);
  padding:14px 16px 12px;
}
.dash-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:30px;height:30px;flex:none;}
.brand-name{font-size:15px; font-weight:700; color:var(--gold-bright); line-height:1.1;}
.brand-sub{font-size:10.5px; color:var(--parchment-dim); letter-spacing:0.04em;}
.coin-pill{
  display:flex; align-items:center; gap:6px;
  background:linear-gradient(135deg, rgba(232,184,75,0.18), rgba(232,184,75,0.06));
  border:1px solid rgba(232,184,75,0.35);
  padding:7px 12px 7px 8px; border-radius:999px;
  font-weight:700; font-size:14px; color:var(--gold-bright);
  font-variant-numeric: tabular-nums; font-family:inherit;
}
.reset-btn{
  flex:none; width:34px; height:34px; border-radius:50%;
  background:rgba(229,72,77,0.1); border:1px solid rgba(229,72,77,0.35);
  color:var(--danger); display:flex; align-items:center; justify-content:center;
  cursor:pointer; padding:0;
}
.reset-btn svg{width:16px;height:16px;}
.reset-btn:active{transform:scale(0.92);}

/* ---------- Account switcher ---------- */
.account-row{display:flex; align-items:center; gap:6px; margin-top:10px; overflow-x:auto; padding-bottom:1px; scrollbar-width:none;}
.account-row::-webkit-scrollbar{display:none;}
.acct-chip{
  flex:none; display:flex; align-items:center; gap:5px;
  background:rgba(255,255,255,0.04); border:1px solid var(--line); color:var(--parchment-dim);
  font-family:inherit; font-size:11px; font-weight:600; padding:6px 10px; border-radius:999px; cursor:pointer;
  white-space:nowrap; transition:all .15s;
}
.acct-chip .acct-dot{width:6px;height:6px;border-radius:50%; background:currentColor; opacity:0.4;}
.acct-chip.active{background:linear-gradient(135deg, rgba(232,184,75,0.22), rgba(232,184,75,0.06)); border-color:rgba(232,184,75,0.5); color:var(--gold-bright);}
.acct-chip.active .acct-dot{background:var(--gold-bright); opacity:1; box-shadow:0 0 6px var(--gold-bright);}
.acct-chip.acct-add{color:var(--parchment-dim); border-style:dashed;}
.acct-chip:active{transform:scale(0.95);}
.coin-pill svg{width:20px;height:20px;}
.level-row{display:flex; align-items:center; gap:10px;}
.level-badge{
  flex:none; width:38px;height:38px; border-radius:11px;
  background:linear-gradient(155deg,var(--ember),var(--ember-dim));
  display:flex; align-items:center; justify-content:center;
  font-family:'Cinzel',serif; font-weight:700; font-size:14px; color:#1a0d06;
  box-shadow:0 6px 16px -6px rgba(255,122,74,0.6);
}
.exp-track{flex:1; height:11px; border-radius:999px; background:rgba(255,255,255,0.06); overflow:hidden; position:relative; border:1px solid rgba(255,255,255,0.06);}
.exp-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,#ff9d6c,var(--gold)); transition:width 0.5s cubic-bezier(.2,.8,.2,1);}
.exp-label{font-size:10px; color:var(--parchment-dim); min-width:64px; text-align:right; font-variant-numeric: tabular-nums;}
.streak-row{display:flex; align-items:center; gap:6px; margin-top:8px; font-size:11.5px; color:var(--parchment-dim);}
.streak-flame{width:15px;height:15px;flex:none;}
.streak-num{color:var(--gold-bright); font-weight:700;}

/* ---------- Main ---------- */
main{padding:18px 16px 8px; max-width:520px; margin:0 auto;}
.stage-card{
  background:radial-gradient(120% 140% at 50% 0%, var(--panel-2), var(--panel));
  border:1px solid var(--line); border-radius:var(--radius-lg);
  padding:22px 18px 18px; text-align:center; position:relative; overflow:hidden;
  box-shadow:var(--shadow-deep);
}
.stage-card::before{
  content:''; position:absolute; inset:0;
  background: radial-gradient(220px 140px at 50% 20%, rgba(255,122,74,0.14), transparent 70%);
  pointer-events:none;
}
.stage-name{font-size:11px; letter-spacing:0.08em; color:var(--parchment-dim); margin-bottom:2px;}
.dragon-title{font-size:19px; font-weight:700; color:var(--gold-bright); margin-bottom:14px;}
.dragon-stage-wrap{width:100%; max-width:230px; margin:0 auto 12px; aspect-ratio:1/1; position:relative;}
.dragon-svg{width:100%; height:100%; filter:drop-shadow(0 14px 22px rgba(0,0,0,0.5));}
.no-dragon{color:var(--parchment-dim); font-size:13.5px; padding:30px 10px; line-height:1.5;}
.stage-progress{display:flex; justify-content:center; gap:5px; margin-top:6px;}
.stage-dot{width:7px;height:7px;border-radius:50%; background:rgba(255,255,255,0.14);}
.stage-dot.on{background:var(--gold); box-shadow:0 0 8px var(--gold);}
.penalty-note{font-size:11.5px; color:var(--ember); margin-top:10px; display:flex; align-items:center; justify-content:center; gap:5px;}
.upgrade-badge{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; letter-spacing:0.03em; color:var(--gold-bright); background:linear-gradient(135deg, rgba(232,184,75,0.2), rgba(232,184,75,0.06)); border:1px solid rgba(232,184,75,0.4); padding:4px 10px; border-radius:999px; margin-top:8px;}

/* ---------- Routine ---------- */
.section-title{font-size:13px; font-weight:700; color:var(--parchment-dim); letter-spacing:0.04em; margin:26px 0 10px 4px; display:flex; align-items:center; gap:8px;}
.section-title .rule{flex:1; height:1px; background:var(--line);}
.routine-list{display:flex; flex-direction:column; gap:10px;}
.round-card{
  display:flex; align-items:center; gap:13px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:13px 14px; transition:border-color .2s, transform .15s;
  cursor:pointer; user-select:none;
}
.round-card:active{transform:scale(0.985);}
.round-card.done{cursor:default;}
.round-card.done{border-color:rgba(95,214,138,0.5); background:linear-gradient(135deg, rgba(95,214,138,0.08), var(--panel));}
.round-check{
  flex:none; width:30px; height:30px; border-radius:9px;
  border:2px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.03);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:all .18s;
}
.round-card.done .round-check{background:var(--good); border-color:var(--good);}
.round-check svg{width:16px;height:16px; opacity:0; transform:scale(0.6); transition:all .18s;}
.round-card.done .round-check svg{opacity:1; transform:scale(1);}
.round-check:active{transform:scale(0.92);}
.round-text{flex:1;}
.round-label{font-size:14px; font-weight:600;}
.round-desc{font-size:11.5px; color:var(--parchment-dim); margin-top:1px;}
.round-exp{font-size:11.5px; font-weight:700; color:var(--gold); flex:none;}
.round-card.done .round-exp{color:var(--good);}
.round-card button.round-check{border:none;}
.round-card:not(.done) .round-check{cursor:pointer;}

/* ---------- Tabs ---------- */
.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  display:flex; background:rgba(14,11,22,0.96); backdrop-filter:blur(14px);
  border-top:1px solid var(--line); padding:8px 8px calc(8px + env(safe-area-inset-bottom));
}
.tab-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; color:var(--parchment-dim); font-family:inherit;
  font-size:10.5px; padding:6px 2px; border-radius:10px; cursor:pointer;
}
.tab-btn svg{width:21px;height:21px;}
.tab-btn.active{color:var(--gold-bright);}
.tab-btn.active svg{filter:drop-shadow(0 0 6px rgba(232,184,75,0.5));}

/* ---------- Panels (Shop / Dex) ---------- */
.panel-overlay{
  position:fixed; inset:0; z-index:50; background:rgba(6,4,10,0.7);
  display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .25s;
}
.panel-overlay.open{opacity:1; pointer-events:auto;}
.panel-sheet{
  width:100%; max-height:88vh; overflow-y:auto;
  background:var(--ink); border-top:1px solid var(--line);
  border-radius:24px 24px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%); transition:transform .3s cubic-bezier(.2,.85,.25,1);
}
.panel-overlay.open .panel-sheet{transform:translateY(0);}
.sheet-handle{width:38px; height:4px; border-radius:99px; background:rgba(255,255,255,0.18); margin:2px auto 14px;}
.sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.sheet-title{font-size:17px; font-weight:700; color:var(--gold-bright);}
.sheet-close{background:none;border:none;color:var(--parchment-dim); width:30px;height:30px; border-radius:50%; display:flex;align-items:center;justify-content:center;}
.sheet-close svg{width:16px;height:16px;}

.tier-block{margin-bottom:20px;}
.tier-head{display:flex; align-items:center; gap:8px; margin-bottom:9px;}
.tier-dot{width:9px;height:9px;border-radius:50%;}
.tier-label{font-size:12.5px; font-weight:700; letter-spacing:0.03em;}
.tier-price{font-size:11px; color:var(--parchment-dim); margin-left:auto;}
.egg-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.egg-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:12px 10px 11px; text-align:center; position:relative;
}
.egg-card svg{width:56px;height:56px; margin-bottom:6px;}
.egg-name{font-size:12px; font-weight:700;}
.egg-buy{
  margin-top:8px; width:100%; padding:8px 0; border-radius:9px; border:none;
  font-family:inherit; font-weight:700; font-size:12px; cursor:pointer;
  background:linear-gradient(135deg,var(--gold),#c9942a); color:#1a1206;
}
.egg-buy:disabled{background:rgba(255,255,255,0.06); color:var(--parchment-dim); cursor:default;}
.egg-owned-tag{position:absolute; top:8px; right:8px; font-size:9px; background:rgba(95,214,138,0.18); color:var(--good); padding:2px 6px; border-radius:6px; font-weight:700;}

.dex-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.dex-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md); padding:10px 6px; text-align:center;}
.dex-card svg{width:100%; height:auto; max-height:64px; margin-bottom:4px;}
.dex-name{font-size:10.5px; font-weight:700;}
.dex-empty{grid-column:1/-1; text-align:center; color:var(--parchment-dim); font-size:13px; padding:30px 10px;}

.inv-row{display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md); padding:10px 12px; margin-bottom:9px;}
.inv-row svg{width:40px;height:40px;flex:none;}
.inv-info{flex:1;}
.inv-name{font-size:13px; font-weight:700;}
.inv-sub{font-size:11px; color:var(--parchment-dim);}
.inv-equip{padding:7px 12px; border-radius:8px; border:1px solid var(--gold); background:transparent; color:var(--gold-bright); font-family:inherit; font-weight:700; font-size:11.5px; cursor:pointer;}
.inv-equip.is-active{background:var(--gold); color:#1a1206;}
.toast{
  position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-140%);
  background:var(--panel-2); border:1px solid var(--gold); color:var(--gold-bright);
  padding:10px 16px; border-radius:999px; font-size:12.5px; font-weight:700;
  z-index:80; transition:transform .35s cubic-bezier(.2,.9,.3,1); box-shadow:var(--shadow-deep);
  display:flex; align-items:center; gap:7px; white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);}

/* ---------- Confirm modal ---------- */
.confirm-overlay{
  position:fixed; inset:0; z-index:90; background:rgba(6,4,10,0.78);
  display:flex; align-items:center; justify-content:center; padding:20px;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.confirm-overlay.open{opacity:1; pointer-events:auto;}
.confirm-box{
  width:100%; max-width:340px; background:var(--panel-2); border:1px solid var(--line);
  border-radius:var(--radius-lg); padding:22px 20px 18px; text-align:center;
  box-shadow:var(--shadow-deep); transform:scale(0.92); transition:transform .2s;
}
.confirm-overlay.open .confirm-box{transform:scale(1);}
.confirm-icon{width:46px;height:46px; margin:0 auto 10px; border-radius:50%; background:rgba(255,122,74,0.12); display:flex; align-items:center; justify-content:center;}
.confirm-icon svg{width:24px;height:24px;}
.confirm-title{font-family:'Cinzel',serif; font-size:17px; font-weight:700; color:var(--parchment); margin-bottom:8px;}
.confirm-body{font-size:12.5px; color:var(--parchment-dim); line-height:1.5; margin-bottom:18px;}
.confirm-actions{display:flex; flex-direction:column; gap:9px;}
.confirm-btn{
  width:100%; padding:12px 0; border-radius:11px; border:none; font-family:inherit;
  font-weight:700; font-size:13.5px; cursor:pointer;
}
.confirm-cancel{background:rgba(255,255,255,0.06); color:var(--parchment); border:1px solid var(--line);}
.confirm-danger{background:linear-gradient(135deg,#ff6b60,var(--danger)); color:#2a0808;}
.confirm-btn:active{transform:scale(0.97);}

/* ---------- Workout Mode ---------- */
.workout-overlay{
  position:fixed; inset:0; z-index:95; background:var(--ink);
  display:flex; flex-direction:column;
  transform:translateY(100%); transition:transform .3s cubic-bezier(.2,.85,.25,1);
}
.workout-overlay.open{transform:translateY(0);}
#workoutSheet{flex:1; display:flex; flex-direction:column; min-height:0;}
.workout-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); flex:none;}
.workout-close{background:none;border:none;color:var(--parchment-dim);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.workout-close svg{width:16px;height:16px;}
.workout-body{flex:1; overflow-y:auto; padding:18px 16px calc(24px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:16px; max-width:480px; margin:0 auto; width:100%;}
.order-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.order-chip{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md); padding:18px 10px; text-align:center; cursor:pointer; position:relative; font-weight:600; font-size:13px;}
.order-chip .order-num{position:absolute; top:6px; left:8px; font-size:10px; font-weight:700; color:var(--gold-bright); background:rgba(232,184,75,0.18); border-radius:50%; width:18px; height:18px; display:none; align-items:center; justify-content:center;}
.order-chip.picked{border-color:var(--gold); background:linear-gradient(135deg, rgba(232,184,75,0.12), var(--panel));}
.camera-wrap{width:100%; aspect-ratio:4/3; background:#000; border-radius:var(--radius-md); overflow:hidden; position:relative; border:1px solid var(--line);}
.camera-wrap video{width:100%; height:100%; object-fit:cover; transform:scaleX(-1);}
.camera-off{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--parchment-dim); font-size:12px; text-align:center; padding:20px; background:var(--panel);}
.ex-title{font-family:'Cinzel',serif; font-size:18px; color:var(--gold-bright); text-align:center;}
.ex-sub{font-size:12px; color:var(--parchment-dim); text-align:center; line-height:1.5;}
.timer-num{font-family:'Cinzel',serif; font-size:44px; font-weight:700; color:var(--parchment); text-align:center;}
.big-btn{width:100%; padding:14px 0; border-radius:14px; border:none; font-family:inherit; font-weight:700; font-size:15px; cursor:pointer; background:linear-gradient(135deg,var(--gold),#c9942a); color:#1a1206;}
.big-btn:disabled{opacity:0.4; cursor:default;}
.big-btn:active:not(:disabled){transform:scale(0.98);}
.counter-row{display:flex; align-items:center; justify-content:center; gap:18px;}
.counter-btn{width:60px; height:60px; border-radius:50%; background:var(--panel-2); border:2px solid var(--gold); color:var(--gold-bright); font-size:26px; font-weight:700; display:flex; align-items:center; justify-content:center; cursor:pointer; font-family:inherit;}
.counter-btn:active{transform:scale(0.92);}
.counter-num{font-family:'Cinzel',serif; font-size:34px; font-weight:700; min-width:104px; text-align:center;}
.bicycle-row{display:flex; gap:14px;}
.bicycle-side{flex:1; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md); padding:14px 8px; text-align:center; display:flex; flex-direction:column; gap:8px; align-items:center;}
.bicycle-side-label{font-size:11px; color:var(--parchment-dim); font-weight:700; letter-spacing:0.04em;}
</style>
</head>
<body>

<header class="dashboard">
  <div class="dash-top">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40"><defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb35c"/><stop offset="1" stop-color="#e8b84b"/></linearGradient></defs><path d="M20 3 C11 3 4 12 5 22 C5.5 27 9 31 12 33 L12 26 C9 24 7.5 20.5 8 17 C9 10 14 6 20 6 C26 6 31 10 32 17 C32.5 20.5 31 24 28 26 L28 33 C31 31 34.5 27 35 22 C36 12 29 3 20 3 Z" fill="url(#bm)"/><circle cx="15.5" cy="16" r="1.6" fill="#1a0d06"/><circle cx="24.5" cy="16" r="1.6" fill="#1a0d06"/></svg>
      <div>
        <div class="brand-name">The Daily Triad</div>
        <div class="brand-sub">DRAGON TAMER</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="coin-pill" id="coinPill" style="cursor:default;">
        <svg viewBox="0 0 24 24"><defs><radialGradient id="coinG" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff3c9"/><stop offset="0.5" stop-color="#e8b84b"/><stop offset="1" stop-color="#a97a1f"/></radialGradient></defs><circle cx="12" cy="12" r="10" fill="url(#coinG)" stroke="#8a611a" stroke-width="1"/><text x="12" y="16.5" font-size="11" font-weight="700" text-anchor="middle" fill="#6b4a12" font-family="Cinzel,serif">T</text></svg>
        <span id="coinCount">50</span>
      </button>
      <button class="reset-btn" id="resetBtn" aria-label="Reset progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>
  </div>
  <div class="level-row">
    <div class="level-badge" id="levelBadge">1</div>
    <div class="exp-track"><div class="exp-fill" id="expFill" style="width:0%"></div></div>
    <div class="exp-label" id="expLabel">0 / 50</div>
  </div>
  <div class="streak-row">
    <svg class="streak-flame" viewBox="0 0 24 24"><path d="M12 2c1 3-2 4-2 7 0 1.7 1.3 3 3 3s3-1.3 3-3c2 2 3 4.5 3 7a7 7 0 1 1-14 0c0-4 2-6 3-9 1 1 1.5 2 1.5 3C9.5 6 10.5 3.5 12 2Z" fill="#ff7a4a"/></svg>
    <span>Streak: <span class="streak-num" id="streakNum">0</span> days</span>
  </div>
  <div class="account-row" id="accountRow"></div>
</header>

<main>

const CLOSE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  {id:'leviathan', tier:'epic', name:'Leviathan', c1:'#4fb0ff', c2:'#0a1f4f'},
  {id:'behemoth', tier:'epic', name:'Behemoth', c1:'#c9a06f', c2:'#3a2410'},
  {id:'wyrm', tier:'epic', name:'Wyrm', c1:'#a06fff', c2:'#1f0a3a'},
  // --- Legendary (extra) ---
  {id:'titan', tier:'legendary', name:'Titan', c1:'#ffe9a8', c2:'#8a5a1f'},
  {id:'olympian', tier:'legendary', name:'Olympian', c1:'#e8f4ff', c2:'#6f8fbf'},
  {id:'genesis', tier:'legendary', name:'Genesis', c1:'#d0ffea', c2:'#1f8f6f'},
  {id:'omega', tier:'legendary', name:'Omega', c1:'#ffb0d0', c2:'#7a1f4a'},
  {id:'eternum', tier:'legendary', name:'Eternum', c1:'#f0e0ff', c2:'#5a3a8f'},
  {id:'zenith', tier:'legendary', name:'Zenith', c1:'#fff0b0', c2:'#bf8a1f'},
  {id:'apex', tier:'legendary', name:'Apex', c1:'#ffcf8a', c2:'#a03f1f'},
  {id:'empyrean', tier:'legendary', name:'Empyrean', c1:'#eaffff', c2:'#4fa0bf'},
  {id:'ragnarok', tier:'legendary', name:'Ragnarok', c1:'#ff8a6f', c2:'#2a0a0a'},
  {id:'elysium', tier:'legendary', name:'Elysium', c1:'#f5ffe0', c2:'#7fbf5a'},
];
const DRAGON_BY_ID = Object.fromEntries(DRAGONS.map(d=>[d.id,d]));
const TIER_BY_KEY = Object.fromEntries(TIERS.map(t=>[t.key,t]));

const STAGES = [
  {key:'egg', min:0, label:'Egg'},
  {key:'baby', min:3, label:'Baby Dragon'},
  {key:'kid', min:10, label:'Kid Dragon'},
  {key:'teen', min:20, label:'Teen Dragon'},
  {key:'adult', min:30, label:'Adult Dragon'},
  {key:'full', min:50, label:'Fully-Grown Dragon'},
];
function stageForStreak(streak){
  let s = STAGES[0];
  for(const st of STAGES){ if(streak >= st.min) s = st; }
  return s;
}

function isUpgraded(){ return state.dex.length > 0; }
function routineLabel(){
  return isUpgraded()
    ? "2 min plank + 20 push-ups + 20 sit-ups + 60 bicycle crunches + 20 squats"
    : "1 min plank + 10 push-ups + 10 sit-ups + 30 bicycle crunches";
}
const EXP_PER_ROUND = 10;

/* ============ STATE ============ */
const DEFAULT_STATE = {
  exp:0, level:1, coins:50,
  streak:0,
  today: null,          // date string
  roundsToday:[false,false,false],
  anyCompletionToday:false,
  lastCheckedDate: null,
  ownedEggs: [],         // {uid, dragonId, tier}
  activeUid: null,
  dex: [],                // {dragonId, completedOn}
  nextUid: 1,
};

function todayStr(){ return new Date().toISOString().slice(0,10); }

/* ============ MULTI-ACCOUNT STORAGE ============ */
const ACCOUNTS_KEY = 'triad_accounts_v1';
const MAX_ACCOUNTS = 5;
function freshAccountData(){ return structuredClone(DEFAULT_STATE); }

function loadAccounts(){
  try{
    const raw = localStorage.getItem(ACCOUNTS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.accounts && parsed.order && parsed.order.length){
        for(const id of parsed.order){
          parsed.accounts[id].data = Object.assign(freshAccountData(), parsed.accounts[id].data);
        }
        return parsed;
      }
    }
  }catch(e){ console.error('accounts load failed', e); }
  // migrate a legacy single-save if present, else start fresh
  let legacyData = null;
  try{
    const oldRaw = localStorage.getItem('triad_state_v1');
    if(oldRaw) legacyData = Object.assign(freshAccountData(), JSON.parse(oldRaw));
  }catch(e){}
  const id = 'acc1';
  return {
    activeId: id,
    order: [id],
    accounts: { [id]: { name: 'Tamer 1', data: legacyData || freshAccountData() } }
  };
}
function saveAccounts(){
  try{ localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accountsStore)); }
  catch(e){ console.error('accounts save failed', e); }
}
function switchAccount(id){
  if(id === accountsStore.activeId) return;
  accountsStore.activeId = id;
  state = accountsStore.accounts[id].data;
  saveAccounts();
  rollDay();
  render();
  renderAccounts();
  showToast(`Switched to ${accountsStore.accounts[id].name}`);
}
function createAccount(){
  if(accountsStore.order.length >= MAX_ACCOUNTS) return;
  const n = accountsStore.order.length + 1;
  const id = 'acc' + Date.now();
  accountsStore.accounts[id] = { name: 'Tamer ' + n, data: freshAccountData() };
  accountsStore.order.push(id);
  switchAccount(id);
}
function renderAccounts(){
  const row = $('#accountRow');
  if(!row) return;
  const chips = accountsStore.order.map(id=>{
    const acc = accountsStore.accounts[id];
    const active = id === accountsStore.activeId;
    return `<button class="acct-chip ${active?'active':''}" data-id="${id}"><span class="acct-dot"></span>${acc.name}</button>`;
  }).join('');
  const addBtn = accountsStore.order.length < MAX_ACCOUNTS ? `<button class="acct-chip acct-add" id="acctAdd">+ New (${accountsStore.order.length}/${MAX_ACCOUNTS})</button>` : `<span class="acct-chip" style="cursor:default;opacity:0.6;">Max ${MAX_ACCOUNTS} reached</span>`;
  row.innerHTML = chips + addBtn;
  row.querySelectorAll('.acct-chip[data-id]').forEach(btn=>{
    btn.addEventListener('click', ()=> switchAccount(btn.dataset.id));
  });
  const addEl = $('#acctAdd');
  if(addEl) addEl.addEventListener('click', createAccount);
}

let accountsStore = loadAccounts();
let state = accountsStore.accounts[accountsStore.activeId].data;

function saveState(){ saveAccounts(); }

/* ============ DAILY ROLLOVER & PENALTY ============ */
function rollDay(){
  const t = todayStr();
  if(state.lastCheckedDate === null){
    state.lastCheckedDate = t;
    state.today = t;
    saveState();
    return;
  }
  if(state.lastCheckedDate !== t){
    const allDone = state.anyCompletionToday;
    if(!allDone){
      applyPenalty();
    }
    state.roundsToday = [false,false,false];
    state.anyCompletionToday = false;
    state.lastCheckedDate = t;
    state.today = t;
    saveState();
  }
}
function applyPenalty(){
  state.streak = 0;
  if(state.activeUid){
    // devolves back to egg: since stage is derived from streak, streak=0 already means egg.
  }
}

/* ============ ACTIONS ============ */
function completeRound(idx){
  if(state.roundsToday[idx]) return;
  state.roundsToday[idx] = true;
  addExp(EXP_PER_ROUND);
  if(state.roundsToday.every(Boolean)){
    const evolved = advanceStreak();
    state.roundsToday = [false,false,false];
    state.anyCompletionToday = true;
    if(!evolved) showToast(`Day complete! Streak now ${state.streak}.`);
  }
  saveState();
  render();
}
function addExp(amount){
  state.exp += amount;
  let ceiling = state.level * 50;
  while(state.exp >= ceiling){
    state.exp -= ceiling;
    state.level += 1;
    const coinAward = 20;
    state.coins += coinAward;
    showToast(`Level ${state.level}! +${coinAward} Triad Coins`);
    ceiling = state.level * 50;
  }
}
function advanceStreak(){
  state.streak += 1;
  let toastShown = false;
  if(state.activeUid){
    const stage = stageForStreak(state.streak);
    if(stage.key === 'full'){
      const wasUpgraded = isUpgraded();
      const egg = state.ownedEggs.find(e=>e.uid===state.activeUid);
      if(egg){
        state.dex.push({dragonId: egg.dragonId, completedOn: todayStr()});
        state.ownedEggs = state.ownedEggs.filter(e=>e.uid!==state.activeUid);
        state.activeUid = null;
        state.streak = 0;
        showToast(`${DRAGON_BY_ID[egg.dragonId].name} joined your DragonDex!`);
        toastShown = true;
        if(!wasUpgraded){
          setTimeout(()=> showToast('Training intensified! Reps doubled + squats added.'), 2800);
        }
      }
    } else {
      const prevStage = stageForStreak(state.streak - 1);
      if(prevStage.key !== stage.key){
        showToast(`Evolved to ${stage.label}!`);
        toastShown = true;
      }
    }
  }
  return toastShown;
}
function buyEgg(dragonId){
  const d = DRAGON_BY_ID[dragonId];
  const tier = TIER_BY_KEY[d.tier];
  if(state.coins < tier.price) return;
  state.coins -= tier.price;
  const uid = state.nextUid++;
  state.ownedEggs.push({uid, dragonId});
  if(!state.activeUid) state.activeUid = uid;
  saveState();
  showToast(`Hatching begun: ${d.name} egg acquired`);
  renderShop();
  renderHeader();
}
function equipEgg(uid){
  state.activeUid = uid;
  saveState();
  renderInventory();
  renderHome();
}

    <path d="M28 88 L38 96 L30 100 L42 110" fill="none" stroke="${d.c2}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

    <ellipse cx="36" cy="30" rx="13" ry="8" fill="white" opacity="0.35"/>
    <ellipse cx="33" cy="27" rx="5" ry="3" fill="white" opacity="0.5"/>
  </svg>`;
}

function dragonSVG(d, stageKey){
  const gid = 'drg'+d.id+stageKey+Math.random().toString(36).slice(2,7);
  const cfg = {
    baby:  {scale:0.56, wingOp:0.55, spikes:false, horns:false, crown:false, tail:0.6, frill:false},
    kid:   {scale:0.70, wingOp:0.75, spikes:true,  horns:false, crown:false, tail:0.8, frill:false},
    teen:  {scale:0.83, wingOp:0.9,  spikes:true,  horns:true,  crown:false, tail:1.0, frill:true},
    adult: {scale:0.95, wingOp:1,    spikes:true,  horns:true,  crown:false, tail:1.1, frill:true},
    full:  {scale:1.06, wingOp:1,    spikes:true,  horns:true,  crown:true,  tail:1.2, frill:true},
  }[stageKey] || {scale:0.56, wingOp:0.55, spikes:false, horns:false, crown:false, tail:0.6, frill:false};

  return `<svg viewBox="0 0 160 170" xmlns="http://www.w3.org/2000/svg" style="transform:scale(${cfg.scale});transform-origin:50% 62%;overflow:visible;">
    <defs>
      <linearGradient id="${gid}b" x1="0.15" y1="0" x2="0.85" y2="1">
        <stop offset="0" stop-color="${d.c1}"/><stop offset="1" stop-color="${d.c2}"/>
      </linearGradient>
      <linearGradient id="${gid}belly" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="${d.c1}" stop-opacity="0.15"/>
      </linearGradient>
      <linearGradient id="${gid}wing" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${d.c1}" stop-opacity="0.95"/><stop offset="1" stop-color="${d.c2}" stop-opacity="0.65"/>
      </linearGradient>
      <radialGradient id="${gid}glow" cx="50%" cy="35%" r="65%">
        <stop offset="0" stop-color="#fff" stop-opacity="0.22"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="${gid}eye" cx="35%" cy="30%" r="70%">
        <stop offset="0" stop-color="#fff8d0"/><stop offset="55%" stop-color="${d.c1}"/><stop offset="100%" stop-color="${d.c2}"/>
      </radialGradient>
    </defs>

    <ellipse cx="80" cy="155" rx="48" ry="8" fill="black" opacity="0.3"/>

    <!-- tail -->
    <path d="M60 132 C30 140 8 ${132-24*cfg.tail} 4 ${100-30*cfg.tail} C18 ${110-22*cfg.tail} 40 116 62 118 Z" fill="url(#${gid}b)"/>
    ${cfg.spikes? `<path d="M18 ${112-24*cfg.tail} l-8 -8 l3 11 Z" fill="${d.c2}"/><path d="M32 118 l-7 -9 l2 11 Z" fill="${d.c2}"/>` : ''}

function artFor(dragonId, stageKey, size){
  const d = DRAGON_BY_ID[dragonId];
  if(stageKey === 'egg') return eggSVG(d, size);
  return dragonSVG(d, stageKey);
}

/* ============ RENDER ============ */
const $ = sel => document.querySelector(sel);
let activeTab = 'home';

function renderHeader(){
  $('#coinCount').textContent = state.coins;
  $('#levelBadge').textContent = state.level;
  const ceiling = state.level*50;
  $('#expFill').style.width = Math.min(100, (state.exp/ceiling)*100) + '%';
  $('#expLabel').textContent = `${state.exp} / ${ceiling}`;
  $('#streakNum').textContent = state.streak;
}

function renderHome(){
  const active = state.ownedEggs.find(e=>e.uid===state.activeUid);
  const stage = stageForStreak(state.streak);
  const artWrap = $('#dragonArt');
  const titleEl = $('#dragonTitle');
  const stageNameEl = $('#stageName');
  const dotsEl = $('#stageDots');
  const penaltyEl = $('#penaltyNote');
  const badgeEl = $('#upgradeBadge');
  badgeEl.innerHTML = isUpgraded()
    ? `<span class="upgrade-badge"><svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M13 2 3 14h7l-1 8 11-14h-7l0-6Z"/></svg>Veteran Training — reps doubled, squats added</span>`
    : '';

  if(!active){
    stageNameEl.textContent = 'No active egg';
    titleEl.textContent = 'Visit the Shop to adopt one';
    artWrap.innerHTML = `<div class="no-dragon">Your nest is empty.<br>Buy a Common egg (50 coins) to begin raising your first dragon.</div>`;
    dotsEl.innerHTML='';
    penaltyEl.style.display='none';
  } else {
    const d = DRAGON_BY_ID[active.dragonId];
    stageNameEl.textContent = `${TIER_BY_KEY[d.tier].label.toUpperCase()} · ${stage.label.toUpperCase()}`;
    titleEl.textContent = `${d.name} Dragon`;
    artWrap.innerHTML = artFor(d.id, stage.key);
    dotsEl.innerHTML = STAGES.map(s=>`<div class="stage-dot ${state.streak>=s.min?'on':''}"></div>`).join('');
    penaltyEl.style.display = 'flex';
  }

  const list = $('#routineList');
  const names = ['Round 1','Round 2','Round 3'];
  list.innerHTML = names.map((n,i)=>`
    <div class="round-card ${state.roundsToday[i]?'done':''}" data-idx="${i}">
      <button class="round-check" data-idx="${i}">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0e0b16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 10 18 20 6"/></svg>
      </button>
      <div class="round-text">
        <div class="round-label">${n}</div>
        <div class="round-desc">${routineLabel()}</div>
      </div>
      <div class="round-exp">+${EXP_PER_ROUND} EXP</div>
    </div>
  `).join('');
  list.querySelectorAll('.round-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const idx = parseInt(card.dataset.idx,10);
      if(state.roundsToday[idx]) return;
      openWorkout(idx);
    });
  });
}

/* ============ WORKOUT MODE ============ */
function getExerciseSet(){
  const upgraded = isUpgraded();
  const set = {
    plank:   {key:'plank',   label:'Plank',              type:'timer',   duration: upgraded?120:60},
    pushup:  {key:'pushup',  label:'Push-ups',           type:'counter', target: upgraded?20:10},
    situp:   {key:'situp',   label:'Sit-ups',            type:'counter', target: upgraded?20:10},
    bicycle: {key:'bicycle', label:'Bicycle Crunches',   type:'bicycle', target: upgraded?60:30},
  };
  if(upgraded){
    set.squat = {key:'squat', label:'Squats', type:'counter', target:20};
  }
  return set;
}
let workout = null;

function openWorkout(roundIdx){
  const exercises = getExerciseSet();
  workout = {
    roundIdx, order:[], step:-1, exercises, totalSteps: Object.keys(exercises).length,
    plankLeft: exercises.plank.duration, plankTimer:null, plankRunning:false,
    counts:{}, bLeft:0, bRight:0, stream:null
  };
  for(const k in exercises) if(exercises[k].type==='counter') workout.counts[k] = 0;
  $('#workoutOverlay').classList.add('open');
  renderWorkout();
}
function closeWorkout(){
  if(workout){
    if(workout.plankTimer) clearInterval(workout.plankTimer);
    if(workout.stream) workout.stream.getTracks().forEach(t=>t.stop());
  }
  workout = null;
  $('#workoutOverlay').classList.remove('open');
  $('#workoutSheet').innerHTML = '';
}
async function startCamera(videoEl){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false});
    if(!workout) { stream.getTracks().forEach(t=>t.stop()); return false; }
    workout.stream = stream;
    videoEl.srcObject = stream;
    return true;
  }catch(e){
    return false;
  }
}
function cameraBlock(){
  return `<div class="camera-wrap"><video id="camVideo" autoplay muted playsinline></video><div class="camera-off" id="camOff" style="display:none;">Camera preview unavailable on this device — continue below.</div></div>`;
}
function wireCamera(){
  const videoEl = $('#camVideo');
  if(!videoEl) return;
  if(workout.stream){
    videoEl.srcObject = workout.stream;
  } else {
    startCamera(videoEl).then(ok=>{
      if(!ok && $('#camOff')){ $('#camOff').style.display='flex'; videoEl.style.display='none'; }
    });
  }
}

function renderWorkout(){
  const sheet = $('#workoutSheet');
  if(!workout) return;

  if(workout.step === -1){
    sheet.innerHTML = `
      <div class="workout-head"><div class="sheet-title">Choose your order</div><button class="workout-close" id="workoutClose">${CLOSE_ICON}</button></div>
      <div class="workout-body">
        <div class="ex-sub">Tap all 4 exercises, in the order you want to do them.</div>
        <div class="order-grid" id="orderGrid">
          ${Object.values(workout.exercises).map(ex=>`<div class="order-chip" data-key="${ex.key}"><div class="order-num"></div>${ex.label}</div>`).join('')}
        </div>
        <button class="big-btn" id="orderConfirm" disabled>Start Workout</button>
      </div>
    `;
    $('#workoutClose').addEventListener('click', closeWorkout);
    const grid = $('#orderGrid');
    grid.querySelectorAll('.order-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const key = chip.dataset.key;
        const idx = workout.order.indexOf(key);
        if(idx>=0) workout.order.splice(idx,1);
        else workout.order.push(key);
        renderWorkout();
      });
    });
    workout.order.forEach((key,i)=>{
      const chip = grid.querySelector(`.order-chip[data-key="${key}"]`);
      if(chip){ chip.classList.add('picked'); const num=chip.querySelector('.order-num'); num.style.display='flex'; num.textContent = i+1; }
    });
    $('#orderConfirm').disabled = workout.order.length !== workout.totalSteps;
    $('#orderConfirm').addEventListener('click', ()=>{
      if(workout.order.length===workout.totalSteps){ workout.step = 0; renderWorkout(); }
    });
    return;
  }

  const key = workout.order[workout.step];
  const ex = workout.exercises[key];
  let bodyHtml = '';

  if(ex.type === 'timer'){
    bodyHtml = `
      ${cameraBlock()}
      <div class="ex-title">${ex.label}</div>
      <div class="ex-sub">Get into plank position, then tap Start. The 60s timer runs continuously — pause any time and resume where you left off.</div>
      <div class="timer-num" id="plankTimerNum">${workout.plankLeft}s</div>
      <button class="big-btn" id="plankStart">${workout.plankRunning ? 'Pause' : (workout.plankLeft<60 ? 'Resume' : 'Start Plank Timer')}</button>
      <button class="big-btn" id="plankSkip" style="background:rgba(255,255,255,0.06); color:var(--parchment);" ${workout.plankLeft>0?'disabled':''}>Continue</button>
    `;
  } else if(ex.type === 'counter'){
    const count = workout.counts[key];
    bodyHtml = `
      ${cameraBlock()}
      <div class="ex-title">${ex.label}</div>
      <div class="ex-sub">Tap the + button once for every rep you complete.</div>
      <div class="counter-row">
        <button class="counter-btn" id="counterMinus">−</button>
        <div class="counter-num" id="counterNum">${count} / ${ex.target}</div>
        <button class="counter-btn" id="counterPlus">+</button>
      </div>
      <button class="big-btn" id="counterDone" ${count<ex.target?'disabled':''}>Continue</button>
    `;
  } else if(ex.type === 'bicycle'){
    bodyHtml = `
      ${cameraBlock()}
      <div class="ex-title">${ex.label}</div>
      <div class="ex-sub">Left elbow to right knee counts Right. Right elbow to left knee counts Left. ${ex.target} needed on each side.</div>
      <div class="bicycle-row">
        <div class="bicycle-side">
          <div class="bicycle-side-label">LEFT</div>
          <div class="counter-num" id="bLeftNum">${workout.bLeft} / ${ex.target}</div>
          <button class="counter-btn" id="bLeftPlus">+</button>
        </div>
        <div class="bicycle-side">
          <div class="bicycle-side-label">RIGHT</div>
          <div class="counter-num" id="bRightNum">${workout.bRight} / ${ex.target}</div>
          <button class="counter-btn" id="bRightPlus">+</button>
        </div>
      </div>
      <button class="big-btn" id="bicycleDone" ${(workout.bLeft<ex.target||workout.bRight<ex.target)?'disabled':''}>Continue</button>
    `;
  }

  sheet.innerHTML = `
    <div class="workout-head"><div class="sheet-title">Step ${workout.step+1} of ${workout.totalSteps}</div><button class="workout-close" id="workoutClose">${CLOSE_ICON}</button></div>
    <div class="workout-body">${bodyHtml}</div>
  `;
  $('#workoutClose').addEventListener('click', closeWorkout);
  wireCamera();

  if(ex.type === 'timer'){
    $('#plankStart').addEventListener('click', ()=>{
      if(workout.plankRunning){
        workout.plankRunning = false;
        clearInterval(workout.plankTimer);
        renderWorkout();
      } else {
        workout.plankRunning = true;
        workout.plankTimer = setInterval(()=>{
          if(!workout) return;
          workout.plankLeft -= 1;
          const numEl = $('#plankTimerNum');
          if(numEl) numEl.textContent = workout.plankLeft + 's';
          if(workout.plankLeft <= 0){
            clearInterval(workout.plankTimer);
            workout.plankRunning = false;
            advanceWorkoutStep();
          }
        }, 1000);
        renderWorkout();
      }
    });
    const skipBtn = $('#plankSkip');
    if(skipBtn) skipBtn.addEventListener('click', ()=>{ if(workout.plankLeft<=0) advanceWorkoutStep(); });
  } else if(ex.type === 'counter'){
    $('#counterPlus').addEventListener('click', ()=>{
      workout.counts[key] = Math.min(ex.target, workout.counts[key]+1);
      renderWorkout();
    });
    $('#counterMinus').addEventListener('click', ()=>{
      workout.counts[key] = Math.max(0, workout.counts[key]-1);
      renderWorkout();
    });
    $('#counterDone').addEventListener('click', ()=>{
      if(workout.counts[key] >= ex.target) advanceWorkoutStep();
    });
  } else if(ex.type === 'bicycle'){
    $('#bLeftPlus').addEventListener('click', ()=>{ workout.bLeft = Math.min(ex.target, workout.bLeft+1); renderWorkout(); });
    $('#bRightPlus').addEventListener('click', ()=>{ workout.bRight = Math.min(ex.target, workout.bRight+1); renderWorkout(); });
    $('#bicycleDone').addEventListener('click', ()=>{
      if(workout.bLeft>=ex.target && workout.bRight>=ex.target) advanceWorkoutStep();
    });
  }
}

function advanceWorkoutStep(){
  if(!workout) return;
  workout.step += 1;
  if(workout.step >= workout.totalSteps){
    const roundIdx = workout.roundIdx;
    closeWorkout();
    completeRound(roundIdx);
  } else {
    renderWorkout();
  }
}

function renderShop(){
  const sheet = $('#sheet');
  let html = `<div class="sheet-handle"></div><div class="sheet-head"><div class="sheet-title">Dragon Egg Shop</div><button class="sheet-close" id="closeSheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`;
  for(const tier of TIERS){
    const dragons = DRAGONS.filter(d=>d.tier===tier.key);
    html += `<div class="tier-block">
      <div class="tier-head"><span class="tier-dot" style="background:${tier.color}"></span><span class="tier-label" style="color:${tier.color}">${tier.label}</span><span class="tier-price">${tier.price} coins</span></div>
      <div class="egg-grid">
        ${dragons.map(d=>{
          const owned = state.ownedEggs.some(e=>e.dragonId===d.id) || state.dex.some(x=>x.dragonId===d.id);
          const afford = state.coins >= tier.price;
          return `<div class="egg-card">
            ${eggSVG(d)}
            <div class="egg-name">${d.name}</div>
            <button class="egg-buy" data-id="${d.id}" ${(!afford)?'disabled':''}>${afford?'Buy '+tier.price:'Need '+tier.price}</button>
            ${owned?'<div class="egg-owned-tag">Owned</div>':''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  sheet.innerHTML = html;
  $('#closeSheet').addEventListener('click', closePanel);
  sheet.querySelectorAll('.egg-buy').forEach(btn=>{
    btn.addEventListener('click', ()=> buyEgg(btn.dataset.id));
  });
}

function renderInventory(){
  const sheet = $('#sheet');
  let html = `<div class="sheet-handle"></div><div class="sheet-head"><div class="sheet-title">Your Eggs</div><button class="sheet-close" id="closeSheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`;
  if(state.ownedEggs.length===0){
    html += `<div class="dex-empty">No eggs yet — visit the Shop.</div>`;
  } else {
    html += state.ownedEggs.map(e=>{
      const d = DRAGON_BY_ID[e.dragonId];
      const stage = e.uid===state.activeUid ? stageForStreak(state.streak) : STAGES[0];
      const isActive = e.uid===state.activeUid;
      return `<div class="inv-row">
        ${artFor(d.id, isActive? stage.key : 'egg', 40)}
        <div class="inv-info">
          <div class="inv-name">${d.name}</div>
          <div class="inv-sub">${TIER_BY_KEY[d.tier].label} · ${isActive? stage.label : 'Resting in nest'}</div>
        </div>
        <button class="inv-equip ${isActive?'is-active':''}" data-uid="${e.uid}">${isActive?'Active':'Equip'}</button>
      </div>`;
    }).join('');
  }
  sheet.innerHTML = html;
  $('#closeSheet').addEventListener('click', closePanel);
  sheet.querySelectorAll('.inv-equip').forEach(btn=>{
    btn.addEventListener('click', ()=> equipEgg(parseInt(btn.dataset.uid,10)));
  });
}

function renderDex(){
  const sheet = $('#sheet');
  let html = `<div class="sheet-handle"></div><div class="sheet-head"><div class="sheet-title">DragonDex</div><button class="sheet-close" id="closeSheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`;
  html += `<div class="dex-grid">`;
  if(state.dex.length===0){
    html += `<div class="dex-empty">Raise a dragon to Day 50 to lock it in permanently.</div>`;
  } else {
    html += state.dex.map(x=>{
      const d = DRAGON_BY_ID[x.dragonId];
      return `<div class="dex-card">${dragonSVG(d,'full')}<div class="dex-name">${d.name}</div></div>`;
    }).join('');
  }
  html += `</div>`;
  sheet.innerHTML = html;
  $('#closeSheet').addEventListener('click', closePanel);
}

function openPanel(tab){
  $('#overlay').classList.add('open');
  if(tab==='shop') renderShop();
  else if(tab==='inventory') renderInventory();
  else if(tab==='dex') renderDex();
}
function closePanel(){
  $('#overlay').classList.remove('open');
  setActiveTab('home');
}

function setActiveTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  if(tab==='home'){ $('#overlay').classList.remove('open'); }
  else { openPanel(tab); }
}

let toastTimer;
function showToast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

function render(){
  renderHeader();
  renderHome();
}

/* ============ INIT ============ */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> setActiveTab(btn.dataset.tab));
});
$('#overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closePanel(); });

$('#resetBtn').addEventListener('click', ()=> $('#confirmOverlay').classList.add('open'));
$('#confirmCancel').addEventListener('click', ()=> $('#confirmOverlay').classList.remove('open'));
$('#confirmDanger').addEventListener('click', ()=>{
  const acc = accountsStore.accounts[accountsStore.activeId];
  acc.data = freshAccountData();
  state = acc.data;
  saveAccounts();
  $('#confirmOverlay').classList.remove('open');
  render();
  showToast('Progress reset for this account.');
});
$('#confirmOverlay').addEventListener('click', (e)=>{ if(e.target.id==='confirmOverlay') $('#confirmOverlay').classList.remove('open'); });

rollDay();
if(state.roundsToday.every(Boolean)){
  state.roundsToday = [false,false,false];
  state.anyCompletionToday = true;
}
render();
renderAccounts();
saveState();
})();
